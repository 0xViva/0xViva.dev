version: "3"

dotenv:
  - .env
  - .env.local

env:
  PORT: 8080

vars:
  image_name: 0xviva/0xviva.dev
  image_tag: latest

tasks:
  dev:
    run: always
    cmds:
      - air

  build:
    deps:
      - task: generate
    cmds:
      - CGO_ENABLED=0 go build -o build/server main.go

  container:
    deps:
      - task: generate
    cmds:
      - docker build -t {{.image_name}}:{{.image_tag}} .

  generate:
    aliases:
      - gen
      - g
    generates:
      - components/**/*.go
      - views/**/*.go
      - style/output.css
    sources:
      - components/**/*.templ
      - views/**/*.templ
      - style/tailwind.config.js
      - style/input.css
    cmds:
      - $HOME/tailwindcss -i style/input.css -o style/output.css
      - templ generate
      - go generate ./...
