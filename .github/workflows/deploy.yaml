name: Build and Deploy

on:
  workflow_dispatch:

concurrency:
  group: webpage-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Fetch the cached Podman/Buildah layers from previous runs
      - name: Cache Podman Layers
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers
          key: ${{ runner.os }}-podman-${{ hashFiles('**/go.sum', 'Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-podman-

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 2. Build using BuildKit features (which natively supports the Dockerfile mounts)
      - name: Build and archive image
        run: |
          podman build \
            --layers \
            --pull=missing \
            --tag "0xviva/0xviva.dev:${SHORT_SHA}" \
            --tag "0xviva/0xviva.dev:latest" .

          podman save \
            -o app.tar \
            "0xviva/0xviva.dev:${SHORT_SHA}"

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          path: ./
          switches: -avzr --include=app.tar --include=docker-compose.yml --exclude=*
          remote_path: /home/deploy/webpage/
          remote_host: ${{ vars.VPS_ADDRESS }}
          remote_user: deploy
          remote_key: ${{ secrets.VPS_DEPLOYMENT_PRIVATE_KEY }}

      - name: Deploy with Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ env.SHORT_SHA }}
          CSS_VERSION: ${{ env.SHORT_SHA }}
          INTERNAL_PORT: ${{ vars.INTERNAL_PORT }}
          EXTERNAL_PORT: ${{ vars.EXTERNAL_PORT }}
          GITHUB_TOKEN: ${{ secrets.PAT }}
        with:
          host: ${{ vars.VPS_ADDRESS }}
          username: deploy
          key: ${{ secrets.VPS_DEPLOYMENT_PRIVATE_KEY }}
          envs: IMAGE_TAG,CSS_VERSION,INTERNAL_PORT,EXTERNAL_PORT,GITHUB_TOKEN
          script: |
            set -e
            cd /home/deploy/webpage
            podman load -i app.tar
            rm -f app.tar
            podman compose up -d --no-build
            podman compose ps
            podman image prune -f
